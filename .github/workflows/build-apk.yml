# build-apk.yml — instrui o GitHub a gerar o APK a cada push
name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissao do gradlew
        run: chmod +x gradlew

      - name: Garantir keystore de assinatura
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Gerar APK (release)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: RadbySoundsUltimate-v2
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
